services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: drone-drive-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drone_drive
    ports:
      - "5432:5432"
    volumes:
      - drone-drive-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  drone-drive-db-data:
